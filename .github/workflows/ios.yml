# Compile Gouffre pour iPhone sur un Mac de GitHub et produit Gouffre.ipa (non signe :
# AltStore ou SideStore le signent avec votre identifiant Apple au moment de l'installer).
name: iPhone
on:
  push:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Compilation
        run: |
          cd ios
          xcodebuild -project Gouffre.xcodeproj -scheme Gouffre -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Paquet .ipa
        run: |
          cd ios
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Gouffre.app Payload/
          zip -qry Gouffre.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Gouffre-iPhone
          path: ios/Gouffre.ipa
